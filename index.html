<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Countdowns</title>

<script src="https://cdn.tailwindcss.com"></script>

<style>
body {
  background: linear-gradient(135deg, #0f172a, #1e293b);
}
.bar {
  transition: width 1s ease-in-out;
}
</style>
</head>

<body class="text-white font-sans min-h-screen flex items-center justify-center">

<div class="w-full max-w-2xl space-y-8 p-6">

  <h1 class="text-3xl font-bold text-center">Countdown</h1>

    <!-- Budget Day -->
  <div class="bg-white/10 backdrop-blur-lg rounded-2xl p-6 shadow-lg">
    <a href="budget.html" class="hover:underline text-xl font-semibold mb-2">Budget Day 2026</a>
    <p id="countdown6" class="text-sm mb-3 opacity-80"></p>

    <div class="w-full bg-white/20 rounded-full h-4 overflow-hidden">
      <div id="bar6" class="bar bg-cyan-400 h-4 rounded-full w-0"></div>
    </div>
  </div>

    <!-- Election -->
  <div class="bg-white/10 backdrop-blur-lg rounded-2xl p-6 shadow-lg">
    <a href="election.html" class="hover:underline text-xl font-semibold mb-2">🇳🇿 2026 General Election 🇳🇿</a>
    <p id="countdown3" class="text-sm mb-3 opacity-80"></p>

    <div class="w-full bg-white/20 rounded-full h-4 overflow-hidden">
      <div id="bar3" class="bar bg-yellow-400 h-4 rounded-full w-0"></div>
    </div>
  </div>

    <!-- GTA VI -->
  <div class="bg-white/10 backdrop-blur-lg rounded-2xl p-6 shadow-lg">
    <a href="gta.html" class="hover:underline text-xl font-semibold mb-2">GTA VI</a>
    <p id="countdown4" class="text-sm mb-3 opacity-80"></p>

    <div class="w-full bg-white/20 rounded-full h-4 overflow-hidden">
      <div id="bar4" class="bar bg-red-400 h-4 rounded-full w-0"></div>
    </div>
  </div>

    <!-- Christmas -->
  <div class="bg-white/10 backdrop-blur-lg rounded-2xl p-6 shadow-lg">
    <a href="xmas.html" class="hover:underline text-xl font-semibold mb-2">Christmas</a>
    <p id="countdown5" class="text-sm mb-3 opacity-80"></p>

    <div class="w-full bg-white/20 rounded-full h-4 overflow-hidden">
      <div id="bar5" class="bar bg-pink-400 h-4 rounded-full w-0"></div>
    </div>
  </div>

</div>

</div>

<script>
function setupCountdown(startDateStr, targetDateStr, countdownEl, barEl) {
  const start = new Date(startDateStr);
  const end = new Date(targetDateStr);

  function update() {
    const now = new Date();

    const total = end - start;
    const elapsed = now - start;
    const remaining = end - now;

    // Countdown text
    if (remaining <= 0) {
      countdownEl.innerText = "🎉 It's time!";
      barEl.style.width = "100%";
      return;
    }

    const days = Math.floor(remaining / (1000 * 60 * 60 * 24));
    const hours = Math.floor((remaining / (1000 * 60 * 60)) % 24);

    countdownEl.innerText = `${days} days, ${hours} hours remaining`;

    // Progress calculation
    let progress = (elapsed / total) * 100;

    // Clamp between 0–100
    progress = Math.max(0, Math.min(100, progress));

    barEl.style.width = progress + "%";
  }

  update();
  setInterval(update, 1000 * 60);
}

// Budget Day (started Jan 2026)
setupCountdown(
  "January 1, 2026 00:00:00",
  "May 28, 2026 00:00:00",
  document.getElementById("countdown6"),
  document.getElementById("bar6")
);
  
// General Election (started Jan 2026)
setupCountdown(
  "January 1, 2026 00:00:00",
  "November 7, 2026 19:00:00",
  document.getElementById("countdown3"),
  document.getElementById("bar3")
);

// GTA VI (started Jan 2026)
setupCountdown(
  "January 1, 2026 00:00:00",
  "November 19, 2026 00:00:00",
  document.getElementById("countdown4"),
  document.getElementById("bar4")
);

// Christmas (started Jan 2026)
setupCountdown(
  "January 1, 2026 00:00:00",
  "December 25, 2026 00:00:00",
  document.getElementById("countdown5"),
  document.getElementById("bar5")
);

</script>

</body>
</html>
